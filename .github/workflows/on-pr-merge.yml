name: Notify n8n on PR merge

on:
  pull_request:
    branches:
      - prod
    types:
      - closed

jobs:
  call_n8n_on_merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git diff

      - name: Get changed files
        id: files
        run: |
          # Get files changed in this merge commit (HEAD vs first parent)
          FILES=$(git diff --name-only HEAD~1 HEAD | jq -R -s -c 'split("\n")[:-1]')
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Debug output (remove after testing)
        run: |
          echo "Changed files: ${{ steps.files.outputs.files }}"

      - name: Call n8n webhook
        run: |
          curl -X POST "$N8N_WEBHOOK_URL" \
            -H "Authorization: Bearer $N8N_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "${{ github.repository }}",
              "pr": ${{ github.event.number }},
              "files": ${{ steps.files.outputs.files }}
            }'
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
